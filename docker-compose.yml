services:
  db:
    image: pgvector/pgvector:pg15-trixie
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/storage
    env_file: .env
    depends_on:
      - db
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
      
  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - ./storage:/storage
    env_file: .env
    depends_on:
      - db
      - redis
      - ml

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  ml:
    build: ./ml
    ports:
      - "8001:8001"
    volumes:
      - ./ml:/app
      - ml_models:/root/.deepface
    restart: unless-stopped
    # TensorFlow/DeepFace в Docker без этого часто падает на /detect (дефолт shm 64MB).
    shm_size: "2gb"
    environment:
      CUDA_VISIBLE_DEVICES: ""
      TF_FORCE_GPU_ALLOW_GROWTH: "false"
      TF_ENABLE_ONEDNN_OPTS: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"

volumes:
  postgres_data:
  ml_models: